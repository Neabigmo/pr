experiment:
  name: dmicf_mini_pilot
  pilot_seed: 20260905
  strict_mode: true
  primary_training_seeds: [20260905, 20260906, 20260907]

sampling:
  protein_pool_size: 1000
  protein_train: 900
  protein_val: 100
  rna_pool_size: 1000
  rna_train: 900
  rna_val: 100
  complex_pool_size: 1100
  complex_dev: 1000
  complex_test: 100
  complex_train: 900
  complex_val: 100

structure_filters:
  exclude_ribosome: true
  exclude_spliceosome: true
  protein_min_length: 30
  protein_max_length: 1000
  rna_min_length: 5
  rna_max_length: 500
  max_total_tokens: 1000
  max_resolution_angstrom: 4.0
  allow_nmr_without_resolution: true
  interface_contact_angstrom: 6.0
  min_interfacial_residue_pairs: 3
  max_interface_missing_fraction: 0.10

leakage:
  strict_validation: true

geometry:
  hidden_dim: 256
  protein_layers: 6
  rna_layers: 6
  decoder_layers: 2
  interaction_layers: 3
  pr_cutoff_angstrom: 8.0
  pr_max_neighbors: 12
  intra_max_neighbors: 32
  rbf_bins: 24
  coordinate_noise_angstrom: 0.10
  edge_dropout: 0.05
  pr_edge_dropout: 0.05
  drop_path: 0.05
  rich_pr_geometry: true

masking:
  min_fraction: 0.10
  max_fraction: 1.00
  curriculum: true
  full_mask_probability: 0.15
  random_mask_probability: 0.70
  local_patch_probability: 0.30
  wrong_token_fraction_within_corruption: 0.10
  interface_mask_multiplier: 2.0
  partner_token_dropout: 0.15

loss:
  protein_label_smoothing: 0.05
  rna_label_smoothing: 0.05
  c_l2_enabled: false
  c_l2_target_fraction: 0.02
  alpha_entropy_warmup_weight: 0.01
  alpha_entropy_warmup_fraction: 0.10

optimization:
  optimizer: adamw
  lr_heads: 0.001
  lr_projections: 0.0005
  lr_encoder_top: 0.0001
  lr_encoder_bottom: 0.00002
  # Primary joint freezes global C. This value is retained for optimizer schema
  # compatibility; fresh scratch joint uses lr_projections for C automatically.
  lr_global_c_joint: 0.00001
  weight_decay: 0.01
  warmup_fraction: 0.04
  schedule: cosine
  grad_clip_norm: 1.0
  precision: bf16
  layerwise_lr_decay: 0.85
  early_stopping_patience: 15
  max_epochs_default: 100

training_stages:
  protein_prior:
    enabled: true
    max_epochs: 150
  rna_prior:
    enabled: true
    max_epochs: 150
  global_c:
    enabled: true
    max_epochs: 80
    hard_context_fraction_late: 0.0
  delta_c:
    enabled: true
    max_epochs: 100
    hard_context_fraction_late: 0.0
  alpha:
    enabled: true
    max_epochs: 80
    hard_context_fraction_late: 0.0
  joint:
    enabled: true
    max_epochs: 150
    task_ratio_start: [2, 2, 1]
    task_ratio_end: [1, 1, 1]
    gradual_unfreezing: true

inference:
  candidates_per_complex: 64
  initial_temperature: 1.0
  spir:
    enabled: true
    reopen_fraction: 0.30
    temperature: 0.5
    reverse_direction_fraction: 0.5
    cycles: 1

evaluation:
  statistical_unit: complex
  joint_validation_orders: 3
  joint_validation_max_complexes: 32
  joint_teacher_forced_orders: 5
  scramble_repeats: 20
  counterfactual_max_partner_sites: 16
  geometry_permutation_repeats: 10
  alpha_ablation_max_targets: 32
  repeated_spir_cycles: 3
  pmi_permutation_repeats: 1000
  noise_levels_angstrom: [0.0, 0.05, 0.10, 0.20]
  pr_edge_drop_levels: [0.0, 0.05, 0.10, 0.20]
  partner_hide_levels: [0.0, 0.10, 0.20, 0.40]
  bootstrap_resamples: 10000
  data_efficiency_fractions: [0.10, 0.25, 0.50, 1.00]
  analysis_seed: 20260905
  primary_candidate_budget: 64
  ablation_candidate_budget: 16
  runtime_profile_complexes: 10
  primary_hypotheses:
    - H1_full_vs_dual_prior_interface_normalized_nll
    - H2_full_vs_partner_blind_and_geometry_only
    - H3_contextual_field_vs_global_C_only
    - H4_partner_scramble_interface_delta_nll

# Declarative scientific invariants are deliberately separated from runtime
# knobs. They are enforced in code/tests and are not presented as fake booleans.
protocol:
  interface_definition: "canonical full-heavy-atom Protein-RNA contact <= 6.0 A; independent of PR message graph"
  strict_split: "final100 frozen first; P30 + R80 + Rfam + exact sequence/mother-sample leakage prohibited"
  pretraining_purge: "final-test homologues/families excluded from Protein/RNA prior pools before 1000-sample draw"
  rna_model_view: "sugar-phosphate/base-sugar backbone only; native base-identity atoms prohibited"
  global_c_initialization: "small random; no empirical PMI initialization"
  global_c_primary_training: "C only, lambda=1, no hard-context mining, no label smoothing"
  delta_stage: "train q/interaction + DeltaC with C/priors/alpha frozen; DeltaC output starts at exact zero"
  alpha_stage: "train relevance residual + tau only; q/DeltaC/C/priors frozen"
  primary_joint_stage: "C remains frozen; contextual heads adapt; pretrained encoders gradual-unfreeze; bounded lambdas learn"
  scratch_control: "same architecture from random initialization; all parameters trainable from step 0"
  loss_balance: "PI/PN/RI/RN mean separately; Protein/RNA normalized by log20/log4 before cross-polymer combination"
  final_refit: "900/100 chooses epoch count; full1000 retraining replays identical development schedule prefix with no validation"
  final_test: "immutable 100 complexes; never used for optimization, threshold selection, architecture changes or candidate-budget tuning"
  confirmatory_statistics: "biological complex is the unit; H1-H4 only; Holm correction across four pre-registered hypotheses"
  secondary_statistics: "broad metric tables are secondary/exploratory and may use BH/effect sizes/CI"
  external_baselines: "official pinned ProteinMPNN and NA-MPNN start from scratch on the exact frozen single-molecule pools; they are one-sided references"
  predicted_structures: "not used in this mini-pilot"
