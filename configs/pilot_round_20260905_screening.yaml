# Temporary screening configuration for the 2026-09-05 execution round.
# This is intentionally separate from configs/pilot.yaml and must not redefine
# the formal pilot_v1 protocol.
structure_filters:
  exclude_ribosome: true
  exclude_spliceosome: true
  require_biological_assembly: true
  protein_min_length: 40
  protein_max_length: 2000
  rna_min_length: 10
  rna_max_length: 500
  max_total_tokens: 1000
  max_resolution_angstrom: 4.0
  allow_nmr_without_resolution: true
  apply_resolution_method_filter: false
  interface_contact_angstrom: 6.0
  min_interfacial_residue_pairs: 3
  max_interface_missing_fraction: 0.10
