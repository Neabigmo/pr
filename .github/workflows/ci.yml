name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Rapid scientific development can create many commits in minutes. Only the
# newest run on a branch is scientifically relevant; older runs are cancelled
# instead of filling the Actions page with stale failures/queues.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Unit tests
        run: python -m pytest

      # Blocking lint is correctness-only while the research code is changing
      # rapidly. Full formatting/style cleanup belongs to a release-prep pass,
      # not to the scientific correctness gate.
      - name: Ruff correctness
        run: ruff check src tests tools --select E9,F63,F7,F82
