name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Unit tests
        run: python -m pytest

      # Blocking lint is intentionally limited to correctness-critical classes:
      # syntax errors, invalid control flow and undefined names. These indicate
      # code that can genuinely fail at runtime and therefore must keep CI red.
      - name: Ruff correctness
        run: ruff check src tests tools --select E9,F63,F7,F82

      # The repository is undergoing rapid scientific prototyping and still has
      # style/cleanup debt (for example compact statements and unused imports).
      # Keep the complete Ruff report visible without conflating style debt with
      # a broken scientific implementation. This should be made blocking after
      # a dedicated formatting/cleanup pass.
      - name: Ruff full style audit
        continue-on-error: true
        run: ruff check src tests tools --output-format=github
