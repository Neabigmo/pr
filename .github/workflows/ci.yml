name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scientific-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Compile all Python entrypoints
        run: python -m compileall -q src tests tools

      - name: Unit and scientific-contract tests
        run: python -m pytest

      - name: Config usage audit
        run: python tools/audit_config_usage.py --config configs/pilot.yaml

      - name: Official baseline wrapper preflight (no clone/GPU)
        run: python tools/preflight_official_baselines.py

      - name: Ruff correctness
        run: ruff check src tests tools --select E9,F63,F7,F82
