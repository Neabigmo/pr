name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Compile all Python
        run: python -m compileall -q src tests tools

      - name: Unit tests
        run: python -m pytest

      - name: Config semantic audit
        run: python tools/audit_config_usage.py --config configs/pilot.yaml --repo-root . --out /tmp/config_audit.json

      - name: CLI smoke tests
        run: |
          pr-pilot --help
          python tools/run_official_baselines.py --help
          python tools/evaluate_official_baselines.py --help
          python tools/run_pilot_experiments.py --help
          python -m pr_pilot.evaluation.full_suite --help
          python -m pr_pilot.evaluation.field_audit --help

      - name: Ruff correctness
        run: ruff check src tests tools --select E9,F63,F7,F82
