[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-mini-pilot"
version = "0.3.0"
description = "Reproducible Protein/RNA inverse-folding and DM-ICF pilot"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "gemmi>=0.6.6",
  "requests>=2.32",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.scripts]
pr-pilot = "pr_pilot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160

# CI lint is deliberately correctness-focused during the active research phase.
# E9 catches syntax/indentation/runtime parse failures; F821 catches undefined
# names. Formatting and one-line-style rules must never obscure a scientifically
# valid test run with a red CI badge. A full style pass is done before release.
[tool.ruff.lint]
select = ["E9", "F821"]
